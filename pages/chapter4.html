<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>活動報名表｜微光同行 · 山嵐相聚</title><link rel="stylesheet" href="../flow.css"></head><body><header class="event-nav"><div class="inner"><a class="event-brand" href="../index.html"><span class="mount">⛰</span><span>微光同行 · 山嵐相聚</span></a><nav class="event-menu"><a href="../index.html">首頁</a><a href="chapter2.html">場地介紹</a><a href="chapter3.html">預算說明</a><a href="chapter6.html">常見問題</a><a class="nav-register" href="chapter4.html">我要報名</a></nav></div></header><main class="page"><div class="form-wrap"><section class="form-heading"><h1>活動報名表</h1><p>填寫以下資料，完成報名</p></section><form class="form-card" id="registrationForm"><div class="form-grid"><div class="field"><label>姓名 *</label><input required placeholder="請輸入姓名"></div><div class="field"><label>飲食注意事項</label><input placeholder="例如：素食、過敏等"></div><div class="field"><label>聯絡電話 *</label><input required placeholder="請輸入手機號碼"></div><div class="field"><label>是否有交通空位？</label><div class="checklist"><label><input type="checkbox"> 可以載其他人</label><label><input type="checkbox"> 需要搭車</label><label><input type="checkbox"> 不確定</label></div></div><div class="field"><label>性別 *</label><div class="choices"><label><input type="radio" name="gender" required> 男</label><label><input type="radio" name="gender"> 女</label></div></div><div class="field"><label>其他備註</label><textarea placeholder="請填寫其他需要讓我們知道的事項"></textarea></div><div class="field"><label>住宿安排 *</label><select required><option value="">請選擇</option><option>雙人帳</option><option>夫妻同帳</option><option>自行安排</option></select><small style="font-size:10px;color:#81908a">例如：與誰同帳篷</small></div></div><p class="form-consent"><label><input type="checkbox" required> 我已閱讀並同意活動注意事項</label></p><div class="form-action"><button class="btn btn-green" type="submit">提交報名</button></div><p class="form-consent">本地 Prototype 不儲存個人資料。正式上線前會接安全後端。</p></form></div></main><script src="../flow.js"></script></body></html>
